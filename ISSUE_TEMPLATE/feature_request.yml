name: Feature request
description: Suggest a new capability or enhancement
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system would this affect?
      options:
        - match (matching engine / cluster)
        - oms (order management / risk / ledger)
        - admin (admin gateway)
        - trading-ui (web UI)
        - cross-cutting / unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the problem or gap this would address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about and why they're not preferred.
    validations:
      required: false
