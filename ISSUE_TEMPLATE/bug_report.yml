name: Bug report
description: Report a defect in Open Exchange
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - match (matching engine cluster)
        - assets (order and ledger core cluster)
        - cluster-kit (shared cluster machinery)
        - cluster-tools (C++ client, forwarder, settlement bridge)
        - tools (probe and test tooling)
        - v0.5 stack (oms, admin, trading-ui)
        - cross-cutting / unsure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      placeholder: |
        Expected:

        Actual:
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git SHA, tag, or build identifier.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant log lines, stack traces, or screenshots.
      render: shell
    validations:
      required: false
